name: Deploy frontend

on:
  push:
    branches:
      - main

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_BASE_URL: /backend
        run: npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Package frontend
        run: tar -czf frontend-release.tar.gz -C dist .

      - name: Upload frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp frontend-release.tar.gz "$VPS_USER@$VPS_HOST:~/frontend-release.tar.gz"

      - name: Publish frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e

            rm -rf ~/frontend-release
            mkdir -p ~/frontend-release

            tar -xzf ~/frontend-release.tar.gz -C ~/frontend-release
            rm -f ~/frontend-release.tar.gz

            mkdir -p /var/www/metin2bazar
            rm -rf /var/www/metin2bazar/*
            cp -a ~/frontend-release/. /var/www/metin2bazar/
            chmod -R a+rX /var/www/metin2bazar

            rm -rf ~/frontend-release
          '
